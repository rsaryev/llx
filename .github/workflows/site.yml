name: site

# Builds site/ and publishes it to Cloudflare Pages (project llx) on every change to the site on
# main. Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The docs pages are built from these.
      - 'docs/**'
      - 'examples/README.md'
      # Served at llx.sh/install.
      - 'scripts/install.sh'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# The newest build wins: an older one still running has nothing to add.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The build CI and a laptop run (scripts/checks/run.sh), from the repository's top.
      - run: scripts/check --only site
        working-directory: .
      - name: Publish dist/ to Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=llx --branch=main
